# Đăng thư mục bitdesk-web-demo/ lên GitHub Pages mỗi khi main thay đổi
# (merge PR vào main = một lần push vào main).
name: Deploy web demo

on:
  push:
    branches: [main]
    paths:
      - "bitdesk-web-demo/**"
      - ".github/workflows/deploy-web-demo.yml"
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ một lần deploy chạy tại một thời điểm; không hủy lần đang chạy dở.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bitdesk-web-demo
      - id: deployment
        uses: actions/deploy-pages@v4
